; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = c3

[env:c3]
platform = espressif32
board = esp32-c3-devkitc-02
upload_protocol = esptool
upload_port = COM11
; upload_protocol = esp-buildin
; upload_port = usb-jtag
framework = arduino
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder, default
monitor_port = COM11
monitor_speed = 115200
debug_tool = esp-builtin
debug_init_break =
build_type = debug

build_flags = -O0 -g3 -ggdb3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
	-DCONFIG_ESP_SYSTEM_PANIC_PRINT_REBOOT=1
	-DCONFIG_BOOTLOADER_LOG_LEVEL_VERBOSE

lib_deps = 
	mikalhart/TinyGPSPlus@^1.0.2
	ArduinoJson
	robtillaart/Complex@^0.3.5
	qrcode
    bodmer/TFT_eSPI@2.5.43

extra_scripts = pre:patch_tft_eSPI_lib.py
